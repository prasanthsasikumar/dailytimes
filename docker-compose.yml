# The Daily Times server (website + relay + MCP) with SQLite on a volume.
# Copy .env.example to .env and fill it in. Put a TLS reverse proxy in front
# (Caddy: `times.example.com { reverse_proxy 127.0.0.1:8787 }`).
services:
  dailytimes:
    build: .
    image: dailytimes:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - dailytimes-data:/data
  # Run the daily job (pre-builds auto editions, applies retention). Optional:
  # editions are also built on demand when a printer or the dashboard asks.
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["sh", "-c", "while true; do curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://dailytimes:8787/cron/daily; sleep 3600; done"]
    depends_on: [dailytimes]

volumes:
  dailytimes-data:
