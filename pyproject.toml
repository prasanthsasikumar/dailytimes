[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dailytimes"
version = "0.2.0"
description = "Daily Times: a relay that lets your AI assistant print a daily brief on any printer, when you walk up to it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "pillow>=10.1",
    "reportlab>=4",
    "qrcode>=7.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
relay = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.0", "jinja2>=3.1", "python-multipart>=0.0.9"]
llm = ["anthropic>=1.0"]
escpos = ["python-escpos>=3.1"]
mdns = ["zeroconf>=0.130"]
gpio = ["gpiozero>=2.0"]
ble = ["bleak>=0.22"]
all = ["dailytimes[relay,escpos,mdns]"]
dev = ["dailytimes[all,llm]", "pytest>=8", "pyjwt>=2"]

[project.scripts]
dailytimes = "dailytimes.cli:main"

[project.entry-points."dailytimes.adapters"]
# Third-party packages can register adapters in this same group.

[tool.hatch.build.targets.wheel]
packages = ["src/dailytimes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
