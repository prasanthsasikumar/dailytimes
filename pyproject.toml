[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dailytimes"
version = "0.2.0"
description = "Your AI writes a one-page newspaper about your day. It prints on any printer you own, when you walk up to it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prasanth Sasikumar" }]
keywords = ["mcp", "ai", "printer", "thermal-printer", "escpos", "newspaper", "claude", "chatgpt", "raspberry-pi", "morning-brief"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
    "Framework :: FastAPI",
]

dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "pillow>=10.1",
    "reportlab>=4",
    "qrcode>=7.4",
    "httpx>=0.27",
    # the server (website, relay, MCP); core so that `pip install dailytimes` and hosts
    # that install from pyproject.toml (Vercel) get a working server
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "mcp>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://times.flowsxr.com"
Source = "https://github.com/prasanthsasikumar/dailytimes"
Issues = "https://github.com/prasanthsasikumar/dailytimes/issues"

[project.optional-dependencies]
relay = []  # kept for compatibility: the server is part of the core install now
llm = ["anthropic>=1.0"]
escpos = ["python-escpos>=3.1"]
mdns = ["zeroconf>=0.130"]
gpio = ["gpiozero>=2.0"]
ble = ["bleak>=0.22"]
all = ["dailytimes[relay,escpos,mdns]"]
dev = ["dailytimes[all,llm]", "pytest>=8", "pyjwt>=2", "numpy>=1.26"]

[project.scripts]
dailytimes = "dailytimes.cli:main"

[project.entry-points."dailytimes.adapters"]
# Third-party packages can register adapters in this same group.

[tool.hatch.build.targets.wheel]
packages = ["src/dailytimes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
